name: Build Android APK

on:
  push:
    branches: [ main ]
    # A push whose every changed file matches here does not build (private-repo Actions minutes). Any other changed file builds.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'android-notes/**'
  workflow_dispatch: {}

permissions:
  contents: write # needed to create the GitHub Release in the last step below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node dependencies
        run: npm ci

      # Decision 272 — Google Drive on/off. With the repository variable GDRIVE_WEB_CLIENT_ID set (a client ID, not a secret), the
      # Drive sign-in block is written into capacitor.config.json here (workspace only) and the web build turns the guard on.
      # Without it nothing changes and Drive stays off.
      - name: Google Drive client (optional)
        env:
          GDRIVE_WEB_CLIENT_ID: ${{ vars.GDRIVE_WEB_CLIENT_ID }}
        run: node scripts/patch-gdrive.js

      - name: Build web assets (Vite bundles src/ into www/)
        run: npm run build

      - name: Add Android platform (if not committed)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Patch AndroidManifest.xml with required permissions
        run: node scripts/patch-manifest.js

      # Disabled for now (Decision 63) — FLAG_SECURE blocks screenshots app-wide, which got in the
      # way of taking screenshots during active development. Re-enable by uncommenting this step;
      # scripts/patch-mainactivity.js itself is untouched and still correct.
      # - name: Patch MainActivity.java (FLAG_SECURE — blank recents preview, block screenshots)
      #   run: node scripts/patch-mainactivity.js

      # Decision 74 — powers the "lock when the phone screen locks" switch (app + vault settings).
      # Runs regardless of whether the FLAG_SECURE step above is enabled; patch-screenlock.js
      # handles MainActivity.java in either state (see that script's own header comment).
      - name: Patch MainActivity.java (screen-off receiver for app/vault lock)
        run: node scripts/patch-screenlock.js

      # Decisions 206, 207 — the File explorer's All files access check and storage volume list (window.ArklyExplorer).
      # Needs the onCreate() that patch-screenlock.js guarantees, so it runs right after it.
      - name: Patch MainActivity.java (File explorer bridge)
        run: node scripts/patch-explorer.js

      # Decision 220 — archive extraction for the File explorer (window.ArklyArchive): copies scripts/java/ArklyArchiveBridge.java,
      # registers it in onCreate() (after the explorer bridge) and adds the extraction libraries to android/app/build.gradle.
      - name: Patch MainActivity.java and Gradle (archive extraction)
        run: node scripts/patch-archive.js

      # Decision 222 — copy and move for the File explorer (window.ArklyFileOps): copies scripts/java/ArklyFileOpsBridge.java and
      # registers it in onCreate(). No Gradle change.
      - name: Patch MainActivity.java (copy and move)
        run: node scripts/patch-fileops.js

      # Decisions 264-266 — quick-capture widget (home-screen provider, layout, manifest receiver): copies
      # scripts/java/ArklyWidgetProvider.java and writes the widget resources. No permission, no Gradle change.
      - name: Add the quick-capture widget (native)
        run: node scripts/patch-widget.js

      # Decision 102 — Snooze/Done from the notification without launching the app. Patches the plugin source in
      # node_modules and writes the receiver into android/, so it runs after both exist and before Gradle compiles.
      - name: Patch reminder notification actions (native receiver)
        run: node scripts/patch-reminder-actions.js

      # Decision 281 — noise reduction for the voice recorder. Patches the plugin source in node_modules so that
      # startRecording({ noiseReduction: true }) records from VOICE_COMMUNICATION; without the option nothing changes.
      - name: Patch voice recorder (noise reduction)
        run: node scripts/patch-voice.js

      - name: Set version code/name for this build
        run: node scripts/patch-version.js
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      # Decision 259 — R8 code shrinking and renaming for the release build, with keep rules for what is reached by name.
      # Remove this step to build without it.
      - name: Enable R8 for the release build
        run: node scripts/patch-r8.js

      - name: Generate app icons from resources/icon.png
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Verify keystore secrets are set
        run: |
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing or empty — release.keystore decoded to 0 bytes. Set it under repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::One or more of KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD is missing. Set all four secrets before running this workflow."
            exit 1
          fi

      # Decision 261 — startup signature check. The release certificate's SHA-256 fingerprint (public) is read from the keystore
      # and written into the app, which compares it with the certificate it is installed under. The password is read from the
      # environment, never from the command line.
      - name: Read release certificate fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          CERT=$(keytool -list -v -keystore android/app/release.keystore -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS")
          FP=$(echo "$CERT" | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':')
          echo "ARKLY_CERT_SHA256=$FP" >> "$GITHUB_ENV"
          # Decision 272 — the two public values the Google Cloud Android client asks for, shown on the run's Summary page.
          SHA1=$(echo "$CERT" | grep -m1 "SHA1:" | sed 's/.*SHA1: *//')
          { echo "### Google Drive setup values (public)"; echo "- Package name: $(node -p "require('./capacitor.config.json').appId")"; echo "- SHA-1 certificate fingerprint: $SHA1"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Add the signature check (native bridge)
        run: node scripts/patch-signature.js

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkly-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Every push to main gets its own tagged Release with the APK attached — separate from the
      # artifact above, which needs a GitHub login and expires; a Release is the permanent, public
      # download the in-app update check (update-check.js) points people at. Tag is exactly
      # APP_VERSION_NAME (set by scripts/patch-version.js into $GITHUB_ENV above, Decision 282)
      # prefixed with "v" — always unique since it is derived from the increasing run number, so
      # this never collides with an existing tag and never needs a --force overwrite.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-run keeps the same run number, so the tag can already exist: replace the APK on that release instead of failing.
          TAG="v${{ env.APP_VERSION_NAME }}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Arkly $TAG" \
              --notes "Automated build from commit ${{ github.sha }}."
          fi
