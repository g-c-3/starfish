name: Clean up old runs

# Manual only: a job costs at least a billed minute, so it runs when started from the Actions tab.
on:
  workflow_dispatch: {}

permissions:
  actions: write # deleting a run also deletes its logs and artifacts
  contents: read

concurrency:
  group: cleanup-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the latest 3 completed runs of each workflow, delete the rest
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "3"
        run: |
          set -uo pipefail
          # Newest first within each workflow. Queued and running runs are never listed, so never deleted.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&status=completed" \
            --jq '.workflow_runs[] | "\(.workflow_id) \(.created_at) \(.id)"' \
            | sort -k1,1n -k2,2r \
            | awk -v keep="${KEEP}" '{ n[$1]++; if (n[$1] > keep) print $3 }' \
            | while read -r id; do
                if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --silent; then
                  echo "deleted run ${id}"
                else
                  echo "could not delete run ${id}"
                fi
              done
