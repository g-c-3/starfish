<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 80 680 680" width="1360" height="1360">
  <defs>
<linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="170" y1="720" x2="440" y2="110"><stop offset="0" stop-color="#FFC400"/><stop offset="0.5" stop-color="#FF8A00"/><stop offset="1" stop-color="#FF5A1F"/></linearGradient>
<linearGradient id="gR" gradientUnits="userSpaceOnUse" x1="360" y1="110" x2="640" y2="720"><stop offset="0" stop-color="#FF4B2B"/><stop offset="0.5" stop-color="#FF2E63"/><stop offset="1" stop-color="#D81B8F"/></linearGradient>
<linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="250" y1="520" x2="590" y2="700"><stop offset="0" stop-color="#FF7A1A"/><stop offset="0.55" stop-color="#F0306A"/><stop offset="1" stop-color="#B0155E"/></linearGradient>
<linearGradient id="gOv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5A1F"/><stop offset="1" stop-color="#FF9A5A"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="foot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.35"/></linearGradient>
<linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a0a60" stop-opacity="0"/><stop offset="1" stop-color="#1a0a60" stop-opacity="0.35"/></linearGradient>
</defs>

  <!-- crossbar (continues the ribbon from the right foot, tucked behind the left leg) -->
  <polygon points="285,489 511,548 584,720 235,628" fill="url(#gB)"/>
  <polygon points="285,489 511,548 584,720 235,628" fill="url(#shade)" opacity="0.8"/>

  <!-- right leg -->
  <polygon points="470,120 690,640 584,720 330,120" fill="url(#gR)"/>
  <polygon points="690,640 584,720 600,640" fill="url(#foot)"/>

  <!-- left leg (front, glassy) -->
  <polygon points="330,120 470,120 216,720 110,640" fill="url(#gL)"/>
  <polygon points="330,120 470,120 216,720 110,640" fill="url(#sheen)"/>
  <polygon points="110,640 216,720 236,672 150,610" fill="url(#foot)"/>

  <!-- apex fold overlap -->
  <polygon points="330,120 470,120 400,285" fill="url(#gOv)" opacity="0.95"/>
  <polygon points="330,120 470,120 400,285" fill="#fff" opacity="0.08"/>

  <!-- crisp edge highlights -->
  <g fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.5" stroke-linejoin="round">
    <path d="M330,120 L110,640"/>
    <path d="M470,120 L690,640"/>
    <path d="M330,120 L470,120"/>
  </g>
</svg>
